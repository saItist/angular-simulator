<!-- Верхняя панель с логотипом и меню -->
<header class="relative w-full bg-[url('/assets/images/mountains-bg.jpg')] bg-cover bg-center h-[985px]">
    <div class="mx-auto pt-4 flex h-[72px] w-[1180px] items-center justify-between">
        <div class="mx-auto pt-4 w-[1180px] flex flex-col items-center mr-24">
            <img src="/assets/images/logo-mountain-icon.svg" alt="Logo" class="w-[130px] h-[72px]"/>
            <h1 class="text-white mt-0 text-xl font-['Nunito_Sans']">{{ companyName }}</h1>
        </div>
        <nav class="flex items-center justify-end w-[830px] h-[44px]">
            <div class="flex items-center gap-[24px] text-white w-[625px] h-[25px]">
                <a href="#" class="nav-link">Главная</a>
                <a href="#" class="nav-link">Про гида</a>
                <a href="#" class="nav-link">Программа тура</a>
                <a href="#" class="nav-link">Стоимость</a>
                <a href="#" class="nav-link">Блог</a>
                <a href="#" class="nav-link">Контакты</a>
            </div>
            <a href="#" class="flex items-center justify-center rounded bg-[#1A3E3E] text-white font-semibold text-lg transition-colors w-[180px] h-[44px]">
            Консультация
            </a>
         </nav>
    </div>
    <!-- Верхний заголовок -->
    <div class="absolute left-1/2 top-[550px] -translate-x-1/2 w-[1080px] h-[150px] text-center">
        <h1 class="font-normal text-left leading-1.3 text-[50px] uppercase leading-tight tracking-wide text-white">
            Насладись прогулкой в горах<br>с командой единомышленников
        </h1>
    </div>
    <!-- Нижний контейнер (поисковая форма) -->
    <div class="absolute left-[calc(50%+45px)] top-[calc(550px+150px+51px)] -translate-x-1/2 w-[1180px] h-[161px] bg-white/40 rounded-xl flex items-center justify-center">
        <!-- Внутренний контейнер с кнопками -->
        <div class="flex items-center w-[1095px] h-[81px] px-6 gap-6 relative">
                <!-- 1. Локация для тура -->
                <div class="flex flex-col items-start">
                    <button type="button" class="w-[270px] h-[52px] px-5 flex items-center justify-between border border-white rounded-lg bg-transparent text-white hover:border-white transition-colors">
                        <!-- Контейнер для текста -->
                        <div class="w-[210px] h-[24px] flex items-center text-lg font-['Nunito_Sans'] font-normal">Локация для тура</div>        
                        <img src="/assets/images/arrow-icon.svg" alt="arrow"/>
                    </button>
                    <div class="absolute left-[40px] bottom-[-10px] text-sm font-['Nunito_Sans'] font-normal text-white">выберите из списка</div>
                </div>
                <!-- 2. Дата похода -->
                <div class="flex flex-col items-start">
                    <button type="button" class="w-[270px] h-[52px] px-5 flex items-center justify-between border border-white rounded-lg bg-transparent text-white hover:border-white transition-colors">
                        <div class="w-[210px] h-[24px] flex items-center text-lg font-['Nunito_Sans'] font-normal">Дата похода</div>
                        <img src="/assets/images/calendar-icon.svg" alt="calendar"/>
                    </button>
                    <div class="absolute left-[337px] bottom-[-10px] text-sm font-['Nunito_Sans'] font-normal text-white">укажите дату</div>
                </div>
                <!-- 3. Кол-во участников -->
                <div class="flex flex-col items-start">
                    <button type="button" class="w-[270px] h-[52px] px-5 flex items-center justify-between border border-white rounded-lg bg-transparent text-white hover:border-white transition-colors">
                        <div class="w-[210px] h-[24px] flex items-center text-lg font-['Nunito_Sans'] font-normal">Участники</div>
                        <img src="/assets/images/arrow-icon.svg" alt="arrow"/>
                    </button>
                    <div class="absolute left-[635px] bottom-[-10px] text-sm font-['Nunito_Sans'] font-normal text-white">укажите кол-во участников</div>
                </div>
                <!-- 4. Кнопка поиска -->
                    <button type="button" class="w-[213px] h-[52px] px-[37px] flex items-center justify-center rounded-md bg-white  font-semibold text-lg transition-colors">
                        <div class="w-[210px] h-[24px] flex items-center text-base font-['Nunito_Sans'] font-bold text-[#1A3E3E]">Найти программу</div>
                    </button>
                   
        </div>           
    </div>
</header>
